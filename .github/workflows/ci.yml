# The checklist that runs on every change. People forget steps; the pipeline never does.
#
# On a pull request:   lint -> test -> secret scan -> build the image and smoke-test it
# On a push to main:   the same, then publish the image to GitHub's registry (GHCR)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:            # a manual "run it now" button in the Actions tab

# The fewest permissions possible by default: read the code, nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"        # the same Python as the image

jobs:
  lint:                         # cheapest check first: seconds, not minutes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff (style and common mistakes)
        run: ruff check src scripts tests
      - name: Import rules (inner layers never import outer ones)
        run: lint-imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Fast tests (unit, integration, model behaviour, golden); no internet needed
        run: pytest --cov --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - name: Keep the coverage report as evidence, even when tests fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: htmlcov/

  image-smoke:                  # build the image once and prove the PACKED service works
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (layers cached between runs)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true            # keep the image on this machine for the smoke test
          tags: stocks-service:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait until it reports healthy
        run: |
          docker run -d --name svc -p 8000:8000 stocks-service:ci
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' svc)"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker ps --filter name=svc
          [ "$status" = "healthy" ] || { docker logs svc; exit 1; }
      - name: The container runs as a normal user, not root
        run: test "$(docker exec svc whoami)" = "appuser"
      - name: Smoke tests against the running container
        run: pytest -m smoke -v
      - name: Container log (for reading when something failed)
        if: always()
        run: docker logs svc

  publish:                      # delivery: only from main, never from a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-smoke]
    permissions:
      contents: read
      packages: write           # only this job may write to the registry
    steps:
      - uses: actions/checkout@v6
      - name: Image names must be lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # made for this run only, expires with it
      - name: Build and push, tagged with the commit it was built from
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Stocks forecast service. A teaching example, not investment advice.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
